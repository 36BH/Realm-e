<title>La Geometría de tu Nombre</title>
<style>
  :root{
    --paper:#F7F2E9; --paper-dark:#EDE5D6; --ink:#2B2115;
    --gold:#A8863D; --gold-text:#4a3410; --blue:#3A4A5C; --soft:#4A3B2C;

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:"Avenir Next","Futura","Optima","Helvetica Neue",sans-serif;
    -webkit-tap-highlight-color:transparent;}
  .serif{font-family:Georgia,serif}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;

  .brand{text-align:center;font-size:.62rem;letter-spacing:.35em;text-transform:uppercase;
    color:var(--blue);margin-bottom:2rem;}
  .dots{display:flex;justify-content:center;gap:.5rem;margin-bottom:2rem;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.25;}
  .dot.on{opacity:.9}
  .step{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.5rem;
    animation:fadeUp .5s ease-out both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  h1{font-family:Georgia,serif;font-size:1.9rem;line-height:1.3;margin:0;}
  h1.big{font-size:2.3rem;color:var(--gold-text);text-align:center}
  h2{font-family:Georgia,serif;font-size:1.25rem;margin:0;}
  p{font-size:1.05rem;line-height:1.65;margin:0;}
  p.small{font-size:.95rem;color:var(--soft)}
  .frase{font-family:Georgia,serif;font-style:italic;font-size:1.1rem;color:var(--gold-text);margin:0;}
  .center{text-align:center}
  .maxw{max-width:420px;margin:0 auto;}
  label.field{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--soft);}
  input[type=text],input[type=email],textarea{
    width:100%;border:0;border-bottom:2px solid rgba(74,59,44,.4);background:transparent;
    padding:.6rem .1rem;font-family:inherit;font-size:1rem;color:var(--ink);outline:none;
  }
  input[type=text]:focus,input[type=email]:focus,textarea:focus{border-bottom-color:var(--gold)}
  textarea{border:1px solid rgba(74,59,44,.3);border-radius:6px;padding:.75rem;min-height:80px;resize:vertical;}
  .btn{border:2px solid var(--gold);background:transparent;color:var(--gold-text);
    padding:.85rem 1.8rem;border-radius:8px;font-family:inherit;font-size:.85rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:.15s;}
  .btn:hover{background:var(--gold);color:var(--paper)}
  .btn:disabled{border-color:rgba(74,59,44,.3);color:rgba(74,59,44,.4);cursor:default;}
  .btn:disabled:hover{background:transparent;color:rgba(74,59,44,.4)}
  .btn.center-self{align-self:center;margin-top:.5rem}
  .opciones{display:flex;flex-direction:column;gap:.5rem;}
  .op{border:2px solid transparent;background:var(--paper-dark);color:var(--ink);
    text-align:left;padding:.8rem 1rem;border-radius:6px;font-family:inherit;font-size:.95rem;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:.75rem;transition:.15s;}
  .op:hover{border-color:rgba(168,134,61,.5)}
  .op.sel{border-color:var(--gold);background:rgba(168,134,61,.24);color:var(--gold-text);font-weight:700;}
  .op-check{font-size:1.15rem;font-weight:700;color:var(--gold-text);flex-shrink:0;line-height:1;}
  .checkbox-row{display:flex;gap:.6rem;align-items:flex-start;font-size:.85rem;font-style:italic;color:var(--soft)}
  .link-inline{background:none;border:0;padding:0;margin:0;font:inherit;font-style:italic;
    color:var(--gold-text);text-decoration:underline;cursor:pointer;}
  .politica-texto{border-left:2px solid rgba(168,134,61,.35)}
  .err{color:#7a1f1f;font-size:.9rem}
  .mic-wrap{display:flex;align-items:center;gap:.75rem;}
  .mic-btn{display:flex;align-items:center;gap:.5rem;border:1px solid rgba(74,59,44,.4);
    background:transparent;color:var(--soft);padding:.55rem 1rem;border-radius:6px;
    font-family:inherit;font-size:.9rem;cursor:pointer;}
  .mic-btn:hover{border-color:var(--gold);color:var(--gold-text)}
  .mic-btn.rec{border-color:var(--gold);background:var(--paper-dark);color:var(--gold-text);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  .mic-note{border:1px solid rgba(74,59,44,.3);background:var(--paper-dark);border-radius:6px;
    padding:.8rem 1rem;font-size:.85rem;color:var(--soft)}
  .mic-listo{border:1px solid rgba(168,134,61,.5);background:var(--paper-dark);border-radius:8px;
    padding:.9rem 1rem;display:flex;flex-direction:column;gap:.65rem;}
  .mic-listo-msg{font-size:.9rem;font-weight:700;color:var(--gold-text);}
  .mic-btn-borrar{align-self:flex-start;display:flex;align-items:center;gap:.4rem;
    border:1px solid rgba(74,59,44,.4);background:transparent;color:var(--soft);
    padding:.5rem 1rem;border-radius:6px;font-family:inherit;font-size:.8rem;cursor:pointer;}
  .mic-btn-borrar:hover{border-color:#7a1f1f;color:#7a1f1f}
  hr{border:0;border-top:1px solid var(--paper-dark);margin:.5rem 0;}
  audio{height:38px;width:100%}
  .resumen{white-space:pre-wrap;font-size:.85rem;background:var(--paper-dark);border-radius:6px;
    padding:1rem;border:1px solid rgba(74,59,44,.25);max-height:40vh;overflow:auto;}
  .copybar{display:flex;gap:.6rem;flex-wrap:wrap}
  .link{background:none;border:none;color:var(--soft);text-decoration:underline;font-size:.8rem;cursor:pointer;font-family:inherit;padding:0;}
</style>
</head>

  cadaQuienDistinto:"distintas formas, según quién te llame",otroIdioma:"un sonido distinto, con el acento de casa"};

function despuesQ1(r){return `Entonces fue ${r} quien me puso en tu camino.`}
function despuesQ3(nr,nv){return `Así fui cambiando contigo. En los documentos puedo aparecer como ${nr}, pero en tu vida también existo como ${nv}.`}
const DESPUES_Q5 = "Quizá no querías dejarme atrás. Quizá solo necesitabas encontrar una forma de reconocerme como tuyo.";
const DESPUES_Q7 = "Cada vez que me corregiste, me adaptaste o decidiste dejarme sonar distinto, también estabas tomando una decisión sobre ti.";

const ENTRADA = {
  titulo:"Conoces tu nombre… pero probablemente no conoces su verdadera historia.",
  cuerpo:"Hay algo detrás de él que quizá nunca te contaron.",
  boton:"Quiero saber",
};
const REGISTRO = {
  intro:"Vamos a empezar con un primer grupo de nombres. Te avisamos por correo cuando llegue tu turno.",
  labelNombre:"¿Cómo te llamas?",
  ayudaNombre:"Escribe tu nombre completo, tal como aparece en tus documentos.",
  labelCorreo:"¿A qué correo te avisamos?",
  boton:"Guardar mi lugar y continuar",
  confirmacion:"Tu lugar está guardado.\n\nAhora conversemos.\n\nSoy tu nombre. El que has escuchado toda tu vida.\n\nTal vez te gusto, tal vez no del todo. Quizá sientes que simplemente te tocó llevarme.\n\nAntes de investigar la historia que comenzó antes de ti, quiero conocer la nuestra: cómo me has vivido tú.",

// Momento único de consentimiento — un solo lugar, en el registro. Texto general
// a propósito (Bethzy, 2026-09-10): sin enumerar dato por dato, y sin mencionar
// ningún correo ni invitar a pedir acceso/corrección/borrado — decisión suya,
// informada por Legal (el derecho existe igual por ley, ella eligió no
// anunciarlo en pantalla).
const CONSENTIMIENTO = {
  texto:[
    "Antes de empezar, esto es lo que hacemos con lo que compartas.",

    "Nada se vende. Nada se comparte. Nada se usa para otra cosa.",
  ],
  checkConsiente:"He leído cómo cuidamos lo que comparto", // "cómo cuidamos lo que comparto" es el enlace que expande texto[]
};
const ANTES_PERFIL = {
  antes:"Ya conozco la parte de mi historia que solo tú podías contar: cómo llegué a tu vida, las formas en que me llaman, cómo sueno para ti y el lugar que ocupo hoy.",

  esculpido:{titulo:"Me hiciste tuyo",texto:"No te limitaste a la forma en que aparezco en tus documentos. Con el tiempo encontraste maneras de hacerme más cercano a ti: quizá me acortaste, me cambiaste o permitiste que quienes te quieren me dieran otra forma. No significa que me hayas rechazado. Parece que fuiste encontrando la manera de reconocerme como tuyo."},

// ---------- Matriz (copiada literal de lib/invitacion/matriz.ts) ----------

const MAPA_ESTATICO = [
  {p:"q1",o:"registroDistinto",perfil:"esculpido",peso:.5},
  {p:"q2",o:"yaLoLlevaba",perfil:"raiz-viva",peso:1},{p:"q2",o:"fe",perfil:"raiz-viva",peso:1},{p:"q2",o:"historia",perfil:"raiz-viva",peso:1},

  {p:"q7",o:"adapteVersion",perfil:"frontera",peso:1},{p:"q7",o:"molestaCallo",perfil:"conquistado",peso:.5},{p:"q7",o:"daIgual",perfil:"ligereza",peso:1},
  {p:"q8",o:"masCarino",perfil:"conquistado",peso:1},{p:"q8",o:"funcional",perfil:"ligereza",peso:1},

];

function tiene(respuestas,p,...ops){const e=respuestas[p]||[];return ops.some(o=>e.includes(o));}

function calcularPerfil(respuestas){
  const origenCreado = tiene(respuestas,"q2","creado");
  const senales=[];
  for(const m of MAPA_ESTATICO){ if(tiene(respuestas,m.p,m.o)) senales.push({perfil:m.perfil,peso:m.peso,p:m.p}); }
  if(tiene(respuestas,"q7","corrijoSiempre")){
    const huboIncomodidad = tiene(respuestas,"q4","incomodidad","costoAceptar") || tiene(respuestas,"q5","nino","adulto","parcial") || tiene(respuestas,"q8","haciendoPaces");
    const dependeContexto = tiene(respuestas,"q6","cambiaSegunQuien","familiaDistinto","otroIdioma");
    if(huboIncomodidad) senales.push({perfil:"conquistado",peso:1,p:"q7"});
    else if(dependeContexto) senales.push({perfil:"frontera",peso:1,p:"q7"});
  }
  const totales=new Map(), preguntasPorPerfil=new Map();
  for(const s of senales){
    totales.set(s.perfil,(totales.get(s.perfil)||0)+s.peso);
    if(!preguntasPorPerfil.has(s.perfil)) preguntasPorPerfil.set(s.perfil,new Set());
    preguntasPorPerfil.get(s.perfil).add(s.p);
  }
  const ordenados=[...totales.entries()].sort((a,b)=>b[1]-a[1]);
  if(!ordenados.length) return {perfil:null,matiz:null,origenCreado};
  const [ganador,puntos]=ordenados[0], segundo=ordenados[1];
  const conteoGanador=senales.filter(s=>s.perfil===ganador).length;
  const preguntasDistintas=preguntasPorPerfil.get(ganador)?.size||0;
  const diferencia=puntos-(segundo?.[1]||0);
  if(!(conteoGanador>=3 && preguntasDistintas>=2 && diferencia>=1)) return {perfil:null,matiz:null,origenCreado};
  const matiz = segundo && puntos===segundo[1] ? segundo[0] : null;
  return {perfil:ganador,matiz,origenCreado};
}

function renderPregunta(preguntaActual){
  let antes = preguntaActual.antes;
  if(antes.includes("__DESPUES_Q1__")){
    const sel = D.respuestas["q1"]?.[0];
    const embed = sel ? (EMBED_Q1[sel]||"alguien") : "alguien";
    antes = antes.replace("__DESPUES_Q1__", despuesQ1(embed));
  }
  if(antes.includes("__DESPUES_Q3__")){
    const textoLibre = (D.textos["q3"]||"").trim();
    const seleccionadas = D.respuestas["q3"]||[];
    const nombreVivido = textoLibre.length>0 ? textoLibre : (primerLabel(seleccionadas.map(id=>EMBED_Q3[id]).filter(Boolean)) || D.nombre || "este nombre");
    antes = antes.replace("__DESPUES_Q3__", despuesQ3(D.nombre||"tu nombre registrado", nombreVivido));
  }
  if(antes.includes("__DESPUES_Q5__")) antes = antes.replace("__DESPUES_Q5__", DESPUES_Q5);
  if(antes.includes("__DESPUES_Q7__")) antes = antes.replace("__DESPUES_Q7__", DESPUES_Q7);

  const parrafos = antes.split("\n\n");
  let html = `<div style="display:flex;flex-direction:column;gap:1.25rem;padding:1.5rem 0;">`;
  parrafos.forEach((par,i)=>{
    html += `<p>${esc(par)}</p>`;
    if(i===0 && parrafos.length>1 && preguntaActual.fraseClave){
      html += `<p class="frase">${esc(preguntaActual.fraseClave)}</p>`;
    }
  });
  if(parrafos.length===1 && preguntaActual.fraseClave){
    html += `<p class="frase">${esc(preguntaActual.fraseClave)}</p>`;
  }
  html += `<h2>${esc(preguntaActual.pregunta)}</h2>`;

  const yaTexto = D.textos[preguntaActual.id] || "";

  if(preguntaActual.textoEsPrincipal){
    html += `
      <div style="display:flex;flex-direction:column;gap:.75rem;">
        <textarea id="ta-${preguntaActual.id}" placeholder="${esc(preguntaActual.placeholderTexto||"")}">${esc(yaTexto)}</textarea>

  if(preguntaActual.opciones){
    html += `<div class="opciones">`;
    const seleccionadas = D.respuestas[preguntaActual.id]||[];
    for(const op of preguntaActual.opciones){
      const sel = seleccionadas.includes(op.id);
      html += `<button class="op${sel?" sel":""}" data-op="${esc(op.id)}" data-q="${preguntaActual.id}" data-multi="${preguntaActual.multi}"><span>${esc(op.label)}</span>${sel?'<span class="op-check">✓</span>':''}</button>`;
    }

  }

  if(preguntaActual.notaInstruccion){
    html += `<p class="small">${esc(preguntaActual.notaInstruccion)}</p>`;
  }

  if(preguntaActual.campoCondicional){
    const activa = (D.respuestas[preguntaActual.id]||[]).some(id=>preguntaActual.campoCondicional.activaSi.includes(id));

// ---------- Envío silencioso a la puerta propia (Worker + D1) ----------
// No reemplaza localStorage: es un guardado adicional. Si falla (sin internet,
// servidor caído) la experiencia de la persona sigue intacta.
async function enviarRespuestasAlServidor(){
  if(!API_ENDPOINT || D._envioEstado==="ok" || D._envioEstado==="enviando") return;
  D._envioEstado = "enviando";
  try{
    const r = D._resultado || calcularPerfil(D.respuestas);
    const respuestas = await Promise.all(PREGUNTAS.map(async (q)=>{
      const seleccionadas = D.respuestas[q.id]||[];
      const labels = seleccionadas.map(id=>{
        const op=(q.opciones||[]).find(o=>o.id===id); return op?op.label:id;
      });
      const grab = grabaciones[q.id];
      const tieneAudioSinTranscribir = grab && grab.estado==="listo-audio" && grab.audioBlob;
      return {
        pregunta: q.pregunta,
        opciones: labels,
        texto: (D.textos[q.id]||"").trim(),
        audioBase64: tieneAudioSinTranscribir ? await blobABase64(grab.audioBlob) : undefined,
        audioMimeType: tieneAudioSinTranscribir ? (grab.audioBlob.type || "audio/webm") : undefined,
      };
    }));
    const payload = {
      nombre: D.nombre, correo: D.correo,
      perfil: r.perfil ? PERFILES[r.perfil].titulo : BAJA_CERTEZA.titulo,
      matiz: r.matiz ? PERFILES[r.matiz].titulo : "",
      respuestas,
    };
    const res = await fetch(API_ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    D._envioEstado = (data && data.ok) ? "ok" : "error";
  }catch(e){
    D._envioEstado = "error"; // fallo silencioso: ya quedó a salvo en localStorage
  }
  guardar();
  const badge = document.getElementById("envio-badge");
  if(badge) badge.textContent = D._envioEstado==="ok" ? "Guardado también en el servidor ✓" : "";
}

// ---------- Grabador de voz real (mismo comportamiento que VoiceRecorder.tsx corregido) ----------

const grabaciones = {}; // qid -> {estado, mediaRecorder, chunks, audioUrl}

function micState(qid){ return grabaciones[qid] || (grabaciones[qid]={estado:"inicial",chunks:[],mediaRecorder:null,audioUrl:null}); }

function renderMicEstado(qid){
  const wrap = document.querySelector(`[data-mic="${qid}"]`);
  if(!wrap) return;
  const st = micState(qid);
  // El aviso de voz que aparecía antes de grabar (estado "permiso") se eliminó
  // por completo (Carril 5, decisión de Bethzy 2026-08-31, Opción A): su
  // contenido ya vive una sola vez en CONSENTIMIENTO, en el registro. El botón
  // de micrófono ahora graba directo — el permiso nativo del navegador/SO es
  // su propio candado.
  // VOZ+CLARIDAD: sello simulado por el agente que construyó este cambio
  // (Carril 3, 2026-08-31) — falta el paso real del Guardián de la Voz y el
  // revisor de claridad (regla 22 de CLAUDE.md); queda pendiente antes de
  // considerarlo definitivo.
  if(st.estado==="grabando"){
    wrap.outerHTML = `<div class="mic-wrap" data-mic="${qid}">
      <button class="mic-btn rec" data-mic-action="detener" data-q="${qid}">● Grabando… toca para detener</button>
    </div>`;
  } else if(st.estado==="transcribiendo"){
    wrap.outerHTML = `<div class="mic-note" data-mic="${qid}">Un momento…</div>`;
  } else if(st.estado==="listo-texto"){
    wrap.outerHTML = `<div class="mic-listo" data-mic="${qid}">
      <p class="mic-listo-msg">✓ Convertido a texto arriba — puedes leerlo y corregirlo</p>
      <button class="mic-btn-borrar" data-mic-action="borrar" data-q="${qid}">🗑 Borrar y regrabar</button>
    </div>`;
  } else if(st.estado==="listo-audio"){
    wrap.outerHTML = `<div class="mic-listo" data-mic="${qid}">
      <p class="mic-listo-msg">✓ Grabado — puedes escucharlo aquí</p>
      <audio controls src="${st.audioUrl}"></audio>
      <button class="mic-btn-borrar" data-mic-action="borrar" data-q="${qid}">🗑 Borrar y regrabar</button>
    </div>`;
  } else if(st.estado==="error"){
    wrap.outerHTML = `<div class="mic-note" data-mic="${qid}">No pudimos acceder al micrófono. Puedes escribirlo en su lugar.</div>`;
  } else {
    wrap.outerHTML = `<div class="mic-wrap" data-mic="${qid}">
      <button class="mic-btn" data-mic-action="grabar" data-q="${qid}">🎙 Contarlo con mi voz</button>
    </div>`;
  }
  wireMic();
}

async function empezarGrabacion(qid){
  const st = micState(qid);
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream);
    st.chunks = [];
    st.audioBlob = null;
    st.transcripcion = "";
    st.transcripcionOk = false;
    st._pendientes = TRANSCRIPCION_DISPONIBLE ? 2 : 1; // MediaRecorder + (si hay) SpeechRecognition
    mr.ondataavailable = e=>st.chunks.push(e.data);
    mr.onstop = ()=>{
      const tipo = mr.mimeType || "audio/webm";
      st.audioBlob = new Blob(st.chunks,{type:tipo});
      st.audioUrl = URL.createObjectURL(st.audioBlob);
      stream.getTracks().forEach(t=>t.stop());
      st._pendientes--;
      if(st._pendientes<=0) finalizarGrabacion(qid);
    };
    st.mediaRecorder = mr;
    mr.start();

    // Camino 1: en paralelo, intentamos oír lo mismo con reconocimiento de
    // voz nativo del teléfono. Si esto falla, no rompe la grabación —
    // simplemente no habrá transcripción y se cae al camino 2.
    if(TRANSCRIPCION_DISPONIBLE){
      try{
        const rec = new SR_CTOR();
        rec.lang = "es-MX";
        rec.continuous = false;
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        rec.onresult = (ev)=>{
          const texto = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
          if(texto && texto.trim()){ st.transcripcion = texto.trim(); st.transcripcionOk = true; }
        };
        rec.onerror = ()=>{ st.transcripcionOk = false; };
        rec.onend = ()=>{ st._pendientes--; if(st._pendientes<=0) finalizarGrabacion(qid); };
        st.recognition = rec;
        rec.start();
      }catch(e){
        // No se pudo ni arrancar el reconocimiento: seguimos solo con audio.
        st._pendientes--;
      }
    }

    st.estado = "grabando";
    renderMicEstado(qid);
  }catch(e){
    st.estado = "error";
    renderMicEstado(qid);
  }
}

function finalizarGrabacion(qid){
  const st = micState(qid);
  if(st.transcripcionOk && st.transcripcion){
    // Éxito gratis: el texto vive en la respuesta, el audio nunca sale del
    // teléfono — se descarta.
    st.estado = "listo-texto";
    D.textos[qid] = st.transcripcion;
    const ta = document.getElementById("ta-"+qid);
    if(ta) ta.value = st.transcripcion;
    st.audioBlob = null;
    st.audioUrl = null;
  } else {
    // Camino 2: sin transcripción, el audio real queda listo para subirse
    // a Drive en el envío final (enviarRespuestasAlServidor).
    st.estado = "listo-audio";
  }
  renderMicEstado(qid);
}

function wireMic(){
  document.querySelectorAll("[data-mic-action]").forEach(btn=>{
    btn.onclick = ()=>{
      const qid = btn.dataset.q, action = btn.dataset.micAction;
      const st = micState(qid);
      if(action==="grabar"){ empezarGrabacion(qid); }
      else if(action==="detener"){
        st.estado = "transcribiendo";
        st.mediaRecorder?.stop();
        try{ st.recognition?.stop(); }catch(e){ /* ya estaba detenido */ }
      }
      else if(action==="borrar"){
        st.estado="inicial"; st.audioUrl=null; st.audioBlob=null;
        st.transcripcion=""; st.transcripcionOk=false; st.driveUrl=null;
        renderMicEstado(qid);
      }
    };
  });
}

// Convierte un Blob a base64 puro (sin el prefijo data:...;base64,) para
// mandarlo al backend en JSON.
function blobABase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=>{
      const resultado = reader.result || "";
      const coma = resultado.indexOf(",");
      resolve(coma>=0 ? resultado.slice(coma+1) : resultado);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ---------- Eventos por paso ----------

function guardarTextosVisibles(){
  document.querySelectorAll("textarea[id^='ta-']").forEach(ta=>{
    const qid = ta.id.replace("ta-","");
    D.textos[qid] = ta.value;
  });
  const cond = document.getElementById("in-condicional");
  if(cond) D.condicionalQ5 = cond.value;
}

function wireStep(preguntaActual){
  const btnReiniciar = document.getElementById("btn-reiniciar");
  if(btnReiniciar) btnReiniciar.onclick = reiniciarExperiencia;

  const btnEntrada = document.getElementById("btn-entrada");
  if(btnEntrada) btnEntrada.onclick = ()=>{ D.step=STEP_REGISTRO; render(); };

  const inNombre = document.getElementById("in-nombre");
  const inCorreo = document.getElementById("in-correo");
  const inConsiente = document.getElementById("in-consiente");
  const btnRegistro = document.getElementById("btn-registro");
  function actualizaBtnRegistro(){
    if(!btnRegistro) return;
    btnRegistro.disabled = !(inNombre.value.trim() && inCorreo.value.trim() && inConsiente.checked);
  }
  if(inNombre){ inNombre.oninput=()=>{ D.nombre=inNombre.value; actualizaBtnRegistro(); }; }
  if(inCorreo){ inCorreo.oninput=()=>{ D.correo=inCorreo.value; actualizaBtnRegistro(); }; }
  if(inConsiente){ inConsiente.onchange=()=>{ D.consiente=inConsiente.checked; actualizaBtnRegistro(); }; }
  const btnPolitica = document.getElementById("btn-toggle-politica");
  const politicaTexto = document.getElementById("politica-texto");
  if(btnPolitica && politicaTexto){ btnPolitica.onclick = ()=>{ politicaTexto.style.display = politicaTexto.style.display==="none" ? "flex" : "none"; }; }
  if(btnRegistro){
    btnRegistro.onclick = ()=>{
      const errBox = document.getElementById("registro-error");
      const correoValido = /\S+@\S+\.\S+/.test(inCorreo.value.trim());
      if(!correoValido){ errBox.textContent = "Ese correo no parece válido."; return; }
      if(!inNombre.value.trim()){ errBox.textContent = "Escribe tu nombre completo."; return; }
      errBox.textContent = "";
      D.nombre = inNombre.value.trim();
      D.correo = inCorreo.value.trim();
      D.step = STEP_UMBRAL;
      render();
    };
  }

  const btnEmpecemos = document.getElementById("btn-empecemos");
  if(btnEmpecemos) btnEmpecemos.onclick = ()=>{ D.step=STEP_PREGUNTAS_INICIO; render(); };

  if(preguntaActual){
    document.querySelectorAll(".op").forEach(op=>{
      op.onclick = ()=>{
        const qid=op.dataset.q, oid=op.dataset.op, multi=op.dataset.multi==="true";
        const actuales = D.respuestas[qid] || [];
        if(multi){
          D.respuestas[qid] = actuales.includes(oid) ? actuales.filter(o=>o!==oid) : [...actuales, oid];
        } else {
          D.respuestas[qid] = [oid];
        }
        guardarTextosVisibles();
        render();
      };
    });
    wireMic();
    const btnContinuar = document.getElementById("btn-continuar");
    if(btnContinuar) btnContinuar.onclick = ()=>{
      guardarTextosVisibles();
      D.step += 1;
      render();
    };
  }

  const btnCierrePerfil = document.getElementById("btn-cierre");
  if(btnCierrePerfil) btnCierrePerfil.onclick = ()=>{ D.step=STEP_CIERRE; render(); enviarRespuestasAlServidor(); };

  const btnCopiar = document.getElementById("btn-copiar");
  if(btnCopiar){
    btnCopiar.onclick = async ()=>{
      const txt = document.getElementById("resumen-txt").textContent;
      const msg = document.getElementById("copiado-msg");
      try{
        await navigator.clipboard.writeText(txt);
      }catch(e){
        // Fallback para navegadores sin permiso de portapapeles.
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); }catch(_e){}
        document.body.removeChild(ta);
      }
      if(msg){ msg.style.display="inline"; setTimeout(()=>{msg.style.display="none";}, 2000); }
    };
  }
}

render();
</script>
