  .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.25;}

  .center{text-align:center}

  .btn{border:2px solid var(--gold);background:transparent;color:var(--gold-text);

  .btn:hover{background:var(--gold);color:var(--paper)}
  .btn:disabled{border-color:rgba(74,59,44,.3);color:rgba(74,59,44,.4);cursor:default;}
  .btn:disabled:hover{background:transparent;color:rgba(74,59,44,.4)}

  .opciones{display:flex;flex-direction:column;gap:.5rem;}
  .op{border:1px solid transparent;background:var(--paper-dark);color:var(--ink);

  .op:hover{border-color:rgba(168,134,61,.5)}

  .mic-wrap{display:flex;align-items:center;gap:.75rem;}
  .mic-btn{display:flex;align-items:center;gap:.5rem;border:1px solid rgba(74,59,44,.4);

  .link{background:none;border:none;color:var(--soft);text-decoration:underline;font-size:.8rem;cursor:pointer;font-family:inherit;padding:0;}
</style>
</head>

const MAPA_ESTATICO = [
  {p:"q1",o:"registroDistinto",perfil:"esculpido",peso:.5},
  {p:"q2",o:"yaLoLlevaba",perfil:"raiz-viva",peso:1},{p:"q2",o:"fe",perfil:"raiz-viva",peso:1},{p:"q2",o:"historia",perfil:"raiz-viva",peso:1},

  {p:"q7",o:"corrijoAVeces",perfil:"frontera",peso:1},{p:"q7",o:"dejoPasar",perfil:"ligereza",peso:.5},
  {p:"q7",o:"adapteVersion",perfil:"frontera",peso:1},{p:"q7",o:"molestaCallo",perfil:"conquistado",peso:.5},{p:"q7",o:"daIgual",perfil:"ligereza",peso:1},
  {p:"q8",o:"masCarino",perfil:"conquistado",peso:1},{p:"q8",o:"funcional",perfil:"ligereza",peso:1},
  {p:"q8",o:"haciendoPaces",perfil:"conquistado",peso:1},{p:"q8",o:"vinculo",perfil:"raiz-viva",peso:1},{p:"q8",o:"nuncaPensado",perfil:"ligereza",peso:.5},
];

function tiene(respuestas,p,...ops){const e=respuestas[p]||[];return ops.some(o=>e.includes(o));}

function calcularPerfil(respuestas){
  if(tiene(respuestas,"q2","creado")) return {perfil:"creado",matiz:null};
  const senales=[];
  for(const m of MAPA_ESTATICO){ if(tiene(respuestas,m.p,m.o)) senales.push({perfil:m.perfil,peso:m.peso,p:m.p}); }
  if(tiene(respuestas,"q7","corrijoSiempre")){
    const huboIncomodidad = tiene(respuestas,"q4","incomodidad","costoAceptar") || tiene(respuestas,"q5","nino","adulto","parcial") || tiene(respuestas,"q8","haciendoPaces");
    const dependeContexto = tiene(respuestas,"q6","cambiaSegunQuien","familiaDistinto","otroIdioma");
    if(huboIncomodidad) senales.push({perfil:"conquistado",peso:1,p:"q7"});
    else if(dependeContexto) senales.push({perfil:"frontera",peso:1,p:"q7"});
  }
  const totales=new Map(), preguntasPorPerfil=new Map();
  for(const s of senales){
    totales.set(s.perfil,(totales.get(s.perfil)||0)+s.peso);
    if(!preguntasPorPerfil.has(s.perfil)) preguntasPorPerfil.set(s.perfil,new Set());
    preguntasPorPerfil.get(s.perfil).add(s.p);
  }
  const ordenados=[...totales.entries()].sort((a,b)=>b[1]-a[1]);
  if(!ordenados.length) return {perfil:null,matiz:null};
  const [ganador,puntos]=ordenados[0], segundo=ordenados[1];
  const conteoGanador=senales.filter(s=>s.perfil===ganador).length;
  const preguntasDistintas=preguntasPorPerfil.get(ganador)?.size||0;
  const diferencia=puntos-(segundo?.[1]||0);
  if(!(conteoGanador>=3 && preguntasDistintas>=2 && diferencia>=1)) return {perfil:null,matiz:null};
  const matiz = segundo && puntos===segundo[1] ? segundo[0] : null;
  return {perfil:ganador,matiz};
}

// ---------- Estado + localStorage (clave realme_inv_v3, heredada del artifact previo) ----------

const LS_KEY = "realme_inv_v3";
// Web App de Apps Script que guarda cada brújula como Issue en 36BH/Realm-e.
// Se llena con la URL real tras el deploy (clasp deploy). Si está vacía, el
// envío a servidor simplemente no ocurre — localStorage sigue siendo la
// fuente de verdad en el dispositivo y nada se rompe.
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbydR7Ha93_isPaDFlMvECsuaGL0Hr1VVn-yTt9GHBaZuOi14ASAErnuKaR6namV_QC7sQ/exec";
function cargarEstado(){
  try{ const raw=localStorage.getItem(LS_KEY); return raw?JSON.parse(raw):{}; }catch{ return {}; }
}
let D = cargarEstado();
function guardar(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){ /* cuota llena: seguimos en memoria */ } }

D.step = D.step ?? 0;
D.nombre = D.nombre ?? "";
D.correo = D.correo ?? "";
D.respuestas = D.respuestas ?? {};
D.textos = D.textos ?? {};
D.condicionalQ5 = D.condicionalQ5 ?? "";

// ---------- Capacidad real de micrófono (nunca se muestra un botón que no graba) ----------

const MIC_DISPONIBLE = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== "undefined");

// ---------- Pasos ----------

const STEP_ENTRADA=0, STEP_REGISTRO=1, STEP_CONFIRMACION=2, STEP_UMBRAL=3, STEP_PREGUNTAS_INICIO=4;
const STEP_PERFIL = STEP_PREGUNTAS_INICIO + PREGUNTAS.length;
const STEP_CIERRE = STEP_PERFIL + 1;

function primerLabel(labels){ labels=labels.filter(Boolean); if(!labels.length) return ""; if(labels.length===1) return labels[0]; return labels.slice(0,-1).join(", ")+" y "+labels[labels.length-1]; }

function capituloIndex(id){
  if(["q1","q2","q3"].includes(id)) return 0;
  if(["q4","q5"].includes(id)) return 1;
  if(["q6","q7"].includes(id)) return 2;
  return 3;
}

function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

const app = document.getElementById("app");

function render(){
  guardar();
  const step = D.step;
  let html = `<div class="brand">La Geometría de tu Nombre</div>`;

  const preguntaActual = (step>=STEP_PREGUNTAS_INICIO && step<STEP_PERFIL) ? PREGUNTAS[step-STEP_PREGUNTAS_INICIO] : null;
  const ci = preguntaActual ? capituloIndex(preguntaActual.id) : -1;
  if(ci>=0){
    html += `<div class="dots">` + [0,1,2,3].map(i=>`<span class="dot${i<=ci?" on":""}"></span>`).join("") + `</div>`;
  }

  html += `<div class="step">`;

  if(step===STEP_ENTRADA){
    html += `
      <div class="center" style="padding:2.5rem 0;display:flex;flex-direction:column;gap:1.5rem;">
        <h1>${esc(ENTRADA.titulo)}</h1>
        <p class="maxw">${esc(ENTRADA.cuerpo)}</p>
        <button class="btn center-self" id="btn-entrada">${esc(ENTRADA.boton)}</button>
      </div>`;
  }
  else if(step===STEP_REGISTRO){
    html += `
      <div style="display:flex;flex-direction:column;gap:1.25rem;padding:2rem 0;">
        <p>${esc(REGISTRO.intro)}</p>
        <label class="field">${esc(REGISTRO.labelNombre)}
          <input type="text" id="in-nombre" placeholder="Tu nombre completo" value="${esc(D.nombre)}">
        </label>
        <p class="small">${esc(REGISTRO.avisoCorreo)}</p>
        <label class="field">${esc(REGISTRO.labelCorreo)}
          <input type="email" id="in-correo" placeholder="tu@correo.com" value="${esc(D.correo)}">
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="in-consiente" ${D.consiente?"checked":""}>
          Acepto que Realm-e guarde mi nombre y correo para reservar mi lugar en la primera edición.
        </label>
        <p class="small" style="font-style:italic">${esc(REGISTRO.pie)}</p>
        <div id="registro-error" class="err"></div>
        <button class="btn" id="btn-registro" style="align-self:flex-start" ${(!D.nombre?.trim()||!D.correo?.trim()||!D.consiente)?"disabled":""}>${esc(REGISTRO.boton)}</button>
      </div>`;
  }
  else if(step===STEP_CONFIRMACION){
    html += `
      <div style="display:flex;flex-direction:column;gap:1.5rem;padding:2.5rem 0;">
        <p>${esc(REGISTRO.confirmacion)}</p>
        <button class="btn center-self" id="btn-continuar-confirm">Continuar</button>
      </div>`;
  }
  else if(step===STEP_UMBRAL){
    html += `
      <div class="center" style="padding:2.5rem 0;display:flex;flex-direction:column;gap:1.5rem;">
        <h1 class="big">${esc(D.nombre||"Tu nombre")}</h1>
        <p class="maxw">Soy tu nombre. El que has escuchado toda tu vida.</p>
        <p class="maxw">Hoy vamos a tener una plática — hay cosas que solo tú sabes de mí, y quiero preguntártelas.</p>
        <button class="btn center-self" id="btn-empecemos">Empecemos</button>
      </div>`;
  }
  else if(preguntaActual){
    html += renderPregunta(preguntaActual);
  }
  else if(step===STEP_PERFIL){
    const r = calcularPerfil(D.respuestas);
    html += `
      <div style="display:flex;flex-direction:column;gap:1.5rem;padding:2rem 0;">
        <p>${esc(ANTES_PERFIL.antes)}</p>
        <p class="frase">${esc(ANTES_PERFIL.fraseClave)}</p>
        <p>${esc(ANTES_PERFIL.gancho)}</p>
        <hr>
        <p>${esc(ANTES_PERFIL.manifiestoIntro)}</p>
        <div class="perfil-box">`;
    if(r.perfil){
      html += `<h3>${esc(PERFILES[r.perfil].titulo)}</h3><p>${esc(PERFILES[r.perfil].texto)}</p>`;
      if(r.matiz){
        html += `<p class="small" style="margin-top:.9rem">Tu forma principal: ${esc(PERFILES[r.perfil].titulo)}. También aparece una señal de ${esc(PERFILES[r.matiz].titulo)}…</p>`;
      }
    } else {
      html += `<h3>${esc(BAJA_CERTEZA.titulo)}</h3><p>${esc(BAJA_CERTEZA.texto)}</p>`;
    }
    html += `</div>
        <p style="font-style:italic">${esc(ANTES_PERFIL.cierre)}</p>
        <button class="btn center-self" id="btn-cierre">Continuar</button>
      </div>`;
    D._resultado = r;
  }
  else if(step===STEP_CIERRE){
    html += `<div style="display:flex;flex-direction:column;gap:1.25rem;padding:2.5rem 0;">`;
    for(const p of CIERRE.cuerpo) html += `<p>${esc(p)}</p>`;
    html += `<p class="frase" style="font-size:1.2rem;margin-top:1rem">${esc(CIERRE.fraseFinal)}</p>`;
    html += renderResumen();
    html += `</div>`;
  }

  html += `</div>`;
  app.innerHTML = html;
  wireStep(preguntaActual);
}

function renderPregunta(preguntaActual){
  let antes = preguntaActual.antes;
  if(antes.includes("__DESPUES_Q1__")){
    const sel = D.respuestas["q1"]?.[0];
    const embed = sel ? (EMBED_Q1[sel]||"alguien") : "alguien";
    antes = antes.replace("__DESPUES_Q1__", despuesQ1(embed));
  }
  if(antes.includes("__DESPUES_Q3__")){
    const textoLibre = (D.textos["q3"]||"").trim();
    const seleccionadas = D.respuestas["q3"]||[];
    const nombreVivido = textoLibre.length>0 ? textoLibre : (primerLabel(seleccionadas.map(id=>EMBED_Q3[id]).filter(Boolean)) || D.nombre || "este nombre");
    antes = antes.replace("__DESPUES_Q3__", despuesQ3(D.nombre||"tu nombre registrado", nombreVivido));
  }
  if(antes.includes("__DESPUES_Q5__")) antes = antes.replace("__DESPUES_Q5__", DESPUES_Q5);
  if(antes.includes("__DESPUES_Q7__")) antes = antes.replace("__DESPUES_Q7__", DESPUES_Q7);

  const parrafos = antes.split("\n\n");
  let html = `<div style="display:flex;flex-direction:column;gap:1.25rem;padding:1.5rem 0;">`;
  parrafos.forEach((par,i)=>{
    html += `<p>${esc(par)}</p>`;
    if(i===0 && parrafos.length>1 && preguntaActual.fraseClave){
      html += `<p class="frase">${esc(preguntaActual.fraseClave)}</p>`;
    }
  });
  if(parrafos.length===1 && preguntaActual.fraseClave){
    html += `<p class="frase">${esc(preguntaActual.fraseClave)}</p>`;
  }
  html += `<h2>${esc(preguntaActual.pregunta)}</h2>`;

  const yaTexto = D.textos[preguntaActual.id] || "";

  if(preguntaActual.textoEsPrincipal){
    html += `
      <div style="display:flex;flex-direction:column;gap:.75rem;">
        <textarea id="ta-${preguntaActual.id}" placeholder="${esc(preguntaActual.placeholderTexto||"")}">${esc(yaTexto)}</textarea>
        ${renderMic(preguntaActual.id)}
      </div>`;
  }

  if(preguntaActual.opciones){
    html += `<div class="opciones">`;
    const seleccionadas = D.respuestas[preguntaActual.id]||[];
    for(const op of preguntaActual.opciones){
      const sel = seleccionadas.includes(op.id);
      html += `<button class="op${sel?" sel":""}" data-op="${esc(op.id)}" data-q="${preguntaActual.id}" data-multi="${preguntaActual.multi}">${esc(op.label)}</button>`;
    }
    html += `</div>`;
  }

  if(preguntaActual.campoCondicional){
    const activa = (D.respuestas[preguntaActual.id]||[]).some(id=>preguntaActual.campoCondicional.activaSi.includes(id));
    if(activa){
      html += `<input type="text" id="in-condicional" placeholder="${esc(preguntaActual.campoCondicional.placeholder)}" value="${esc(D.condicionalQ5)}">`;
    }
  }

  if(!preguntaActual.textoEsPrincipal && (preguntaActual.permiteTexto || preguntaActual.permiteVoz)){
    html += `<div style="display:flex;flex-direction:column;gap:.75rem;padding-top:.25rem;">`;
    if(preguntaActual.permiteTexto){
      html += `<textarea id="ta-${preguntaActual.id}" placeholder="${esc(preguntaActual.notaSuave||'Escribirlo (opcional)')}">${esc(yaTexto)}</textarea>`;
    }
    if(preguntaActual.permiteVoz){
      html += renderMic(preguntaActual.id);
    }
    html += `</div>`;
  }

  const puedeContinuar = !preguntaActual.opciones || (D.respuestas[preguntaActual.id]||[]).length>0;
  html += `<button class="btn" id="btn-continuar" style="align-self:flex-start;margin-top:.5rem" ${puedeContinuar?"":"disabled"}>Continuar</button>`;
  html += `</div>`;
  return html;
}

// Grabación real cuando el navegador lo permite; si no, nota honesta — nunca
// un botón de micrófono que aparenta grabar y no graba.
function renderMic(qid){
  if(!MIC_DISPONIBLE){
    return `<div class="mic-note">Este navegador no permite grabar voz aquí. Puedes escribirlo arriba — vale exactamente lo mismo.</div>`;
  }
  return `<div class="mic-wrap" data-mic="${qid}">
    <button class="mic-btn" data-mic-action="pedir" data-q="${qid}">🎙 Contarlo con mi voz</button>
  </div>`;
}

function renderResumen(){
  const r = D._resultado || calcularPerfil(D.respuestas);
  const perfilTxt = r.perfil ? PERFILES[r.perfil].titulo : BAJA_CERTEZA.titulo;
  let txt = `BRÚJULA — La Geometría de tu Nombre\n`;
  txt += `Nombre: ${D.nombre}\n`;
  txt += `Perfil: ${perfilTxt}${r.matiz?` (con matiz de ${PERFILES[r.matiz].titulo})`:""}\n\n`;
  PREGUNTAS.forEach((q,i)=>{
    const sel = (D.respuestas[q.id]||[]).map(id=>{
      const op=(q.opciones||[]).find(o=>o.id===id); return op?op.label:id;
    });
    const texto = (D.textos[q.id]||"").trim();
    txt += `${i+1}. ${q.pregunta}\n`;
    if(sel.length) txt += `   Marcó: ${sel.join(", ")}\n`;
    if(texto) txt += `   Escribió: ${texto}\n`;
    if(!sel.length && !texto) txt += `   (sin respuesta)\n`;
  });
  return `
    <div style="margin-top:1rem;display:flex;flex-direction:column;gap:.75rem;">
      <p class="small" style="font-style:italic">Guardado en este dispositivo. Aquí tienes tu resumen — cópialo si quieres guardarlo aparte:</p>
      <div class="resumen" id="resumen-txt">${esc(txt)}</div>
      <div class="copybar">
        <button class="btn" id="btn-copiar" style="padding:.6rem 1.2rem;font-size:.75rem">Copiar resumen</button>
        <span id="copiado-msg" class="small" style="display:none">Copiado ✓</span>
      </div>
      <span id="envio-badge" class="small" style="color:var(--soft)">${D._envioEstado==="ok"?"Guardado también en el servidor ✓":""}</span>
    </div>`;
}

// ---------- Envío silencioso al backend (Apps Script → Issue en GitHub) ----------
// No reemplaza localStorage: es un guardado adicional. Si falla (sin internet,
// endpoint vacío, servidor caído) la experiencia de la persona sigue intacta.
async function enviarRespuestasAlServidor(){
  if(!GAS_ENDPOINT || D._envioEstado==="ok" || D._envioEstado==="enviando") return;
  D._envioEstado = "enviando";
  try{
    const r = D._resultado || calcularPerfil(D.respuestas);
    const respuestas = PREGUNTAS.map(q=>{
      const seleccionadas = D.respuestas[q.id]||[];
      const labels = seleccionadas.map(id=>{
        const op=(q.opciones||[]).find(o=>o.id===id); return op?op.label:id;
      });
      return {
        pregunta: q.pregunta,
        opciones: labels,
        texto: (D.textos[q.id]||"").trim(),
        audio: !!(grabaciones[q.id] && grabaciones[q.id].estado==="listo"),
      };
    });
    const payload = {
      nombre: D.nombre, correo: D.correo,
      perfil: r.perfil ? PERFILES[r.perfil].titulo : BAJA_CERTEZA.titulo,
      matiz: r.matiz ? PERFILES[r.matiz].titulo : "",
      respuestas,
    };
    await fetch(GAS_ENDPOINT, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, // evita preflight CORS en Apps Script
      body: JSON.stringify(payload),
    });
    D._envioEstado = "ok";
  }catch(e){
    D._envioEstado = "error"; // fallo silencioso: ya quedó a salvo en localStorage
  }
  guardar();
  const badge = document.getElementById("envio-badge");
  if(badge) badge.textContent = D._envioEstado==="ok" ? "Guardado también en el servidor ✓" : "";
}

// ---------- Grabador de voz real (mismo comportamiento que VoiceRecorder.tsx corregido) ----------

const grabaciones = {}; // qid -> {estado, mediaRecorder, chunks, audioUrl}

function micState(qid){ return grabaciones[qid] || (grabaciones[qid]={estado:"inicial",chunks:[],mediaRecorder:null,audioUrl:null}); }

function renderMicEstado(qid){
  const wrap = document.querySelector(`[data-mic="${qid}"]`);
  if(!wrap) return;
  const st = micState(qid);
  if(st.estado==="permiso"){
    wrap.outerHTML = `<div class="mic-note" data-mic="${qid}">
      <p style="margin-bottom:.6rem">Al grabar, guardamos tu voz solo como contexto para la investigación de tu nombre. Nunca se procesa con IA ni se comparte.</p>
      <button class="mic-btn" data-mic-action="grabar" data-q="${qid}">Entendido, grabar</button>
    </div>`;
  } else if(st.estado==="grabando"){
    wrap.outerHTML = `<div class="mic-wrap" data-mic="${qid}">
      <button class="mic-btn rec" data-mic-action="detener" data-q="${qid}">● Grabando… toca para detener</button>
    </div>`;
  } else if(st.estado==="listo"){
    wrap.outerHTML = `<div class="mic-wrap" data-mic="${qid}">
      <audio controls src="${st.audioUrl}"></audio>
      <button class="link" data-mic-action="borrar" data-q="${qid}">borrar</button>
    </div>`;
  } else if(st.estado==="error"){
    wrap.outerHTML = `<div class="mic-note" data-mic="${qid}">No pudimos acceder al micrófono. Puedes escribirlo en su lugar.</div>`;
  } else {
    wrap.outerHTML = `<div class="mic-wrap" data-mic="${qid}">
      <button class="mic-btn" data-mic-action="pedir" data-q="${qid}">🎙 Contarlo con mi voz</button>
    </div>`;
  }
  wireMic();
}

async function empezarGrabacion(qid){
  const st = micState(qid);
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream);
    st.chunks = [];
    mr.ondataavailable = e=>st.chunks.push(e.data);
    mr.onstop = ()=>{
      const tipo = mr.mimeType || "audio/webm";
      const blob = new Blob(st.chunks,{type:tipo});
      st.audioUrl = URL.createObjectURL(blob);
      st.estado = "listo";
      stream.getTracks().forEach(t=>t.stop());
      renderMicEstado(qid);
    };
    st.mediaRecorder = mr;
    mr.start();
    st.estado = "grabando";
    renderMicEstado(qid);
  }catch(e){
    st.estado = "error";
    renderMicEstado(qid);
  }
}

function wireMic(){
  document.querySelectorAll("[data-mic-action]").forEach(btn=>{
    btn.onclick = ()=>{
      const qid = btn.dataset.q, action = btn.dataset.micAction;
      const st = micState(qid);
      if(action==="pedir"){ st.estado="permiso"; renderMicEstado(qid); }
      else if(action==="grabar"){ empezarGrabacion(qid); }
      else if(action==="detener"){ st.mediaRecorder?.stop(); }
      else if(action==="borrar"){ st.estado="inicial"; st.audioUrl=null; renderMicEstado(qid); }
    };
  });
}

// ---------- Eventos por paso ----------

function guardarTextosVisibles(){
  document.querySelectorAll("textarea[id^='ta-']").forEach(ta=>{
    const qid = ta.id.replace("ta-","");
    D.textos[qid] = ta.value;
  });
  const cond = document.getElementById("in-condicional");
  if(cond) D.condicionalQ5 = cond.value;
}

function wireStep(preguntaActual){
  const btnEntrada = document.getElementById("btn-entrada");
  if(btnEntrada) btnEntrada.onclick = ()=>{ D.step=STEP_REGISTRO; render(); };

  const inNombre = document.getElementById("in-nombre");
  const inCorreo = document.getElementById("in-correo");
  const inConsiente = document.getElementById("in-consiente");
  const btnRegistro = document.getElementById("btn-registro");
  function actualizaBtnRegistro(){
    if(!btnRegistro) return;
    btnRegistro.disabled = !(inNombre.value.trim() && inCorreo.value.trim() && inConsiente.checked);
  }
  if(inNombre){ inNombre.oninput=()=>{ D.nombre=inNombre.value; actualizaBtnRegistro(); }; }
  if(inCorreo){ inCorreo.oninput=()=>{ D.correo=inCorreo.value; actualizaBtnRegistro(); }; }
  if(inConsiente){ inConsiente.onchange=()=>{ D.consiente=inConsiente.checked; actualizaBtnRegistro(); }; }
  if(btnRegistro){
    btnRegistro.onclick = ()=>{
      const errBox = document.getElementById("registro-error");
      const correoValido = /\S+@\S+\.\S+/.test(inCorreo.value.trim());
      if(!correoValido){ errBox.textContent = "Ese correo no parece válido."; return; }
      if(!inNombre.value.trim()){ errBox.textContent = "Escribe tu nombre completo."; return; }
      errBox.textContent = "";
      D.nombre = inNombre.value.trim();
      D.correo = inCorreo.value.trim();
      D.step = STEP_CONFIRMACION;
      render();
    };
  }

  const btnConfirm = document.getElementById("btn-continuar-confirm");
  if(btnConfirm) btnConfirm.onclick = ()=>{ D.step=STEP_UMBRAL; render(); };

  const btnEmpecemos = document.getElementById("btn-empecemos");
  if(btnEmpecemos) btnEmpecemos.onclick = ()=>{ D.step=STEP_PREGUNTAS_INICIO; render(); };

  if(preguntaActual){
    document.querySelectorAll(".op").forEach(op=>{
      op.onclick = ()=>{
        const qid=op.dataset.q, oid=op.dataset.op, multi=op.dataset.multi==="true";
        const actuales = D.respuestas[qid] || [];
        if(multi){
          D.respuestas[qid] = actuales.includes(oid) ? actuales.filter(o=>o!==oid) : [...actuales, oid];
        } else {
          D.respuestas[qid] = [oid];
        }
        guardarTextosVisibles();
        render();
      };
    });
    wireMic();
    const btnContinuar = document.getElementById("btn-continuar");
    if(btnContinuar) btnContinuar.onclick = ()=>{
      guardarTextosVisibles();
      D.step += 1;
      render();
    };
  }

  const btnCierrePerfil = document.getElementById("btn-cierre");
  if(btnCierrePerfil) btnCierrePerfil.onclick = ()=>{ D.step=STEP_CIERRE; render(); enviarRespuestasAlServidor(); };

  const btnCopiar = document.getElementById("btn-copiar");
  if(btnCopiar){
    btnCopiar.onclick = async ()=>{
      const txt = document.getElementById("resumen-txt").textContent;
      const msg = document.getElementById("copiado-msg");
      try{
        await navigator.clipboard.writeText(txt);
      }catch(e){
        // Fallback para navegadores sin permiso de portapapeles.
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); }catch(_e){}
        document.body.removeChild(ta);
      }
      if(msg){ msg.style.display="inline"; setTimeout(()=>{msg.style.display="none";}, 2000); }
    };
  }
}

render();
</script>
